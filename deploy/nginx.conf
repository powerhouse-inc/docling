# Reference reverse-proxy settings for the conversion service.
#
# Two defaults will break document ingestion if left alone, and both fail in
# ways that look like something else:
#
#   client_max_body_size  1m   -> 413 before the service sees a byte. The vault
#                                 caps uploads at 30 MB, so almost every real
#                                 document is rejected by the proxy.
#   proxy_read_timeout    60s  -> a long conversion's connection is cut mid
#                                 flight. The caller sees a network error with
#                                 nothing about the document in it.
#
# The service emits a keep-alive byte every CONVERT_HEARTBEAT_MS (default 15 s)
# precisely so the second one stops mattering — nginx resets its read timer on
# any upstream byte. The generous timeouts below are belt and braces: the
# heartbeat covers proxies you control, these cover the ones you forget.
#
# The same two settings, by other names:
#
#   Envoy / Istio       route.timeout (default 15 s — raise it), and
#                       per_connection_buffer_limit_bytes
#   HAProxy             timeout server / timeout tunnel
#   AWS ALB             idle_timeout.timeout_seconds (default 60)
#   GCP LB              backendService.timeoutSec (default 30)
#   Cloudflare          ~100 s proxy timeout, not configurable below Enterprise;
#                       the heartbeat is the only thing that helps there
#   Traefik             serversTransport.forwardingTimeouts.responseHeaderTimeout
#   Kubernetes ingress-nginx:
#                       nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
#                       nginx.ingress.kubernetes.io/proxy-body-size: "256m"

server {
  listen 443 ssl http2;
  server_name docling.example.com;

  # A self-signed or partial chain fails closed: Node's fetch validates strictly
  # and has no override, so the vault reports ok:false — indistinguishable from
  # the service being down. Use a full chain.
  ssl_certificate     /etc/letsencrypt/live/docling.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/docling.example.com/privkey.pem;

  # Matches the service's own CONVERT_MAX_BYTES default. The real limit is the
  # vault's 30 MB; this is deliberately the looser of the two so the rejection
  # comes from the application, with a message, rather than from the proxy.
  client_max_body_size 256m;

  location / {
    proxy_pass http://127.0.0.1:5011;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 30 minutes, matching the vault client's own timeout. A 238-page book takes
    # minutes; this must never be the thing that fails a large document.
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout 30s;

    # The heartbeat is worthless if nginx sits on it waiting for a full buffer.
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # Health is small and frequent; keep it snappy so a hung conversion does not
  # make the service look unreachable to an orchestrator.
  location = /health {
    proxy_pass http://127.0.0.1:5011/health;
    proxy_read_timeout 10s;
  }
}
