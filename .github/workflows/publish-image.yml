# Builds the conversion service image and pushes it to the Vetra container
# registry (Harbor) and GHCR.
#
# This repository publishes an *image*, not an npm package: the service is not a
# Powerhouse reactor package, it is a plain HTTP service the vault reaches over
# CONVERT_SERVICE_URL.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Image channel tag"
        required: true
        type: choice
        options: [dev, staging, latest]
        default: dev

env:
  DOCKER_REGISTRY: cr.vetra.io
  GHCR_REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run tsc
      - run: bun run lint
      - run: bun run test

  publish:
    name: Build & push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # `secrets` is NOT an available context in a step-level `if:`. Referencing it
    # there is a workflow *validation* error, so GitHub fails the run before it
    # starts a single job — the run shows conclusion=failure with total_count: 0
    # and no check runs, which is what happened on 2026-09-19. Hoisting the
    # secrets into the job env and testing `env.` is the supported way to keep
    # the Harbor push optional for forks that have no credentials.
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL="${{ inputs.channel }}"
          CHANNEL="${CHANNEL:-dev}"
          PROJECT="${{ secrets.DOCKER_PROJECT || 'docling' }}"

          GHCR_BASE="${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${PROJECT}/docling"
          HARBOR_BASE="${{ env.DOCKER_REGISTRY }}/${PROJECT}/docling"

          # Harbor tags are added only when Harbor credentials exist. The login
          # step below is already optional, so emitting Harbor tags
          # unconditionally made `build-push` fail on an unauthenticated push
          # for any fork without DOCKER_USERNAME -- the optionality has to cover
          # the tag list too, not just the login.
          TAGS="${GHCR_BASE}:v${VERSION},${GHCR_BASE}:${CHANNEL},${GHCR_BASE}:${GITHUB_SHA::7}"
          if [ -n "$DOCKER_USERNAME" ]; then
            TAGS="${TAGS},${HARBOR_BASE}:v${VERSION},${HARBOR_BASE}:${CHANNEL},${HARBOR_BASE}:${GITHUB_SHA::7}"
          else
            echo "::notice::Harbor credentials absent - publishing to GHCR only"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "Tags: $TAGS"

      # Harbor rejects a push to a project that does not exist yet, so create it
      # on first publish. Idempotent: an existing project is left alone.
      - name: Ensure Harbor project exists
        if: env.DOCKER_USERNAME != ''
        run: |
          PROJECT="${{ steps.meta.outputs.project }}"
          EXISTS=$(curl -s -u "$DOCKER_USERNAME:$DOCKER_PASSWORD" \
            "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects?name=${PROJECT}" \
            | jq -r ".[]? | select(.name==\"${PROJECT}\") | .name")
          if [ "$EXISTS" = "$PROJECT" ]; then
            echo "Project ${PROJECT} already exists"
          else
            curl -fsS -X POST \
              -u "$DOCKER_USERNAME:$DOCKER_PASSWORD" \
              -H "Content-Type: application/json" \
              -d "{\"project_name\": \"${PROJECT}\", \"public\": false}" \
              "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.DOCKER_USERNAME != ''
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: docling
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Point the vault at it with \`CONVERT_SERVICE_URL\`." >> $GITHUB_STEP_SUMMARY
