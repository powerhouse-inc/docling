# Builds the conversion service image and pushes it to the Vetra container
# registry (Harbor) and GHCR.
#
# This repository publishes an *image*, not an npm package: the service is not a
# Powerhouse reactor package, it is a plain HTTP service the vault reaches over
# CONVERT_SERVICE_URL.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Image channel tag"
        required: true
        type: choice
        options: [dev, staging, latest]
        default: dev

env:
  DOCKER_REGISTRY: cr.vetra.io
  GHCR_REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run tsc
      - run: bun run lint
      - run: bun run test

  publish:
    name: Build & push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL="${{ inputs.channel }}"
          CHANNEL="${CHANNEL:-dev}"
          PROJECT="${{ secrets.DOCKER_PROJECT || 'docling' }}"

          GHCR_BASE="${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${PROJECT}/docling"
          HARBOR_BASE="${{ env.DOCKER_REGISTRY }}/${PROJECT}/docling"

          TAGS="${GHCR_BASE}:v${VERSION},${HARBOR_BASE}:v${VERSION}"
          TAGS="${TAGS},${GHCR_BASE}:${CHANNEL},${HARBOR_BASE}:${CHANNEL}"
          TAGS="${TAGS},${GHCR_BASE}:${GITHUB_SHA::7},${HARBOR_BASE}:${GITHUB_SHA::7}"

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "Tags: $TAGS"

      # Harbor rejects a push to a project that does not exist yet, so create it
      # on first publish. Idempotent: an existing project is left alone.
      - name: Ensure Harbor project exists
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          PROJECT="${{ steps.meta.outputs.project }}"
          EXISTS=$(curl -s -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
            "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects?name=${PROJECT}" \
            | jq -r ".[]? | select(.name==\"${PROJECT}\") | .name")
          if [ "$EXISTS" = "$PROJECT" ]; then
            echo "Project ${PROJECT} already exists"
          else
            curl -fsS -X POST \
              -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
              -H "Content-Type: application/json" \
              -d "{\"project_name\": \"${PROJECT}\", \"public\": false}" \
              "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: docling
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Point the vault at it with \`CONVERT_SERVICE_URL\`." >> $GITHUB_STEP_SUMMARY
